    <script>
    (function () {
        var MIGRATED_COOKIE = 'amap_migrated_to_new_version';
        var VISITED_COOKIE = 'amap_pc_visited';
        var MIGRATE_SRC_COOKIE = 'amap_migrate_src';
        var MIGRATE_SRC = 'auto_new_gray';
        var UUID_KEY = 'amap-uuid';
        // 下列规则与 version-control.js 及 nginx app.conf 保持一致
        // /detail 整个前缀都不放行：新版无 /ssr/detail 落地页，且 /detail/get/* 等是老版在用的 XHR 接口
        // /around 不放行：新版无对应落地页（/ssr/around 实测 404），放行后是 302 → 404 → not-found 客户端兜底跳
        // /search 的三跳，且老版 /around 本身只是热搜面板（无站内入口，等价于首页聚焦搜索框），迁移无收益
        var PATH_WHITELIST = /^\/$|^\/(search|dir|place|faves)(\/.*)?$/;
        var EXCEPT_QUERY = /innersrc=uriapi/;
        var EXCEPT_REFERER = /uri\.amap\.com/i;

        // 对外契约：state 为 skipped（前置门拦住）/ pending（配置请求中）/ done（已出结果）
        var gray = { state: 'skipped', hit: false, bucket: null, rate: null, error: null, _queue: [] };
        gray.onDone = function (cb) {
            if (gray.state === 'pending') { gray._queue.push(cb); } else { cb(gray); }
        };
        window.__AMAP_NEW_USER_GRAY__ = gray;

        function settle(patch) {
            for (var k in patch) {
                if (patch.hasOwnProperty(k)) { gray[k] = patch[k]; }
            }
            gray.state = 'done';
            var queue = gray._queue;
            gray._queue = [];
            for (var i = 0; i < queue.length; i++) {
                try { queue[i](gray); } catch (e) {}
            }
        }

        function getCookie(name) {
            var m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]*)');
            return m ? m[2] : null;
        }

        // 只能写当前站点所属的主域：写对端主域会被浏览器静默丢弃（util.setCookie 的双写同样只有一半生效），
        // 对端域的 cookie 必须请 anotherDomainPrefix() 指向的服务端代种
        function setCookie(name, value, days) {
            var host = location.host;
            var domain = '';
            if (host.indexOf('gaode.com') !== -1) {
                domain = '; domain=.gaode.com';
            } else if (host.indexOf('amap.com') !== -1) {
                domain = '; domain=.amap.com';
            }
            document.cookie = name + '=' + value
                + '; expires=' + new Date(Date.now() + days * 86400000).toUTCString()
                + '; path=/' + domain;
        }

        // 与 assets/com/amap-tools.js 的 getHostPrefix 保持一致：非线上环境不跳域（否则会往线上种 cookie），
        // 线上按当前所在域取对端主域，不能硬编码单一方向。
        // 按 hostname 而非完整 origin 匹配：本地带端口访问时 origin 带上 :6001，照 origin 比会漏判成线上
        var OFFLINE_HOSTS = ['dev-pc.amap.com', 'pre-lbs-pc.amap.com', 'daily-lbs-pc.amap.com', 'localhost', '127.0.0.1'];

        function anotherDomainPrefix() {
            for (var i = 0; i < OFFLINE_HOSTS.length; i++) {
                if (location.hostname === OFFLINE_HOSTS[i]) {
                    return location.origin;
                }
            }
            return location.host.indexOf('gaode.com') !== -1 ? 'https://ditu.amap.com' : 'https://gaode.com';
        }

        // 等价于 store.disabled 探测：localStorage 写入静默失败时 amap-uuid 无法持久化，
        // 同一用户每次访问都会被当成新用户重新分桶，实际迁移量按 1-(1-rate)^N 膨胀
        function localStorageUsable() {
            try {
                var k = '__amap_gray_probe__';
                localStorage.setItem(k, k);
                var ok = localStorage.getItem(k) === k;
                localStorage.removeItem(k);
                return ok;
            } catch (e) {
                return false;
            }
        }

        // 与 assets/com/amap-tools.js getId 格式保持一致
        function createUuid() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        // 与 version-control.js calculateBucketFromUUID 保持一致
        function bucketOf(uuid) {
            return parseInt(uuid.replace(/-/g, '').substring(0, 8), 16) % 10000;
        }

        // 新版 PC 支持的浏览器版本下限（同 version-control.js NEW_PC_BROWSER_MIN_VERSIONS），
        // 对应 amap-pc-ssr docs/BROWSER_SUPPORT.md 完整体验档；低于该下限进入新 PC 会出现白屏或严重功能缺失。
        // iOS Safari 与 macOS Safari 共用 Version/X.Y 标识，统一按 16.4 下限处理。
        // 识别不出的国产 Chromium 壳浏览器（360、QQ 等）默认放行，与既有宽松口径一致。
        // 注意：index.html 由本文件经 webpack ReplacePlugin 生成，改动须同步 version-control.js；
        // 不要直接修改 index.html，否则会被下一次构建覆盖。
        function browserSupportedByNewPC() {
            var ua = navigator.userAgent || '';
            var m = ua.match(/\bEdge\/([\d.]+)/);
            if (m) { return false; } // EdgeHTML 版本上限 18，远低于 88，新版不支持；它无 documentMode，上一道 IE 门拦不住
            m = ua.match(/\bEdg\/([\d.]+)/);
            if (m) { return parseFloat(m[1]) >= 88; }
            m = ua.match(/\bFirefox\/([\d.]+)/);
            if (m) { return parseFloat(m[1]) >= 91; }
            m = ua.match(/\bChrome\/([\d.]+)/);
            if (m) { return parseFloat(m[1]) >= 88; }
            if (/\bSafari\/[\d.]+/.test(ua)) {
                m = ua.match(/\bVersion\/([\d.]+)/);
                return !!m && parseFloat(m[1]) >= 16.4;
            }
            return true;
        }

        function configUrl() {
            var h = location.hostname;
            var base;
            if (h.indexOf('dev-pc') !== -1 || h.indexOf('localhost') !== -1 || h.indexOf('127.0.0.1') !== -1 || h.indexOf('daily') !== -1) {
                base = 'https://amap-pc-ssr.amap.test';
            } else if (h.indexOf('pre') !== -1) {
                base = 'https://pre-amap-pc-ssr.amap.com';
            } else {
                base = 'https://amap-pc-ssr.amap.com';
            }
            return base + '/ssr/api/getNewVersionRolloutConfig';
        }

        // 持有 Image 引用，避免请求发出前对象被回收
        var pendingImages = [];

        // goldlog SDK 此刻尚未加载，且命中后立即跳转，只能用 sendBeacon 交由服务端转投 h5_log。
        // 返回 true 表示已入 beacon 队列（规范保证跨页面卸载送达）；返回 false 表示退到了 Image，
        // 这种请求会被 location.replace 中断，调用方需要为它留出发起时间，否则实验组数据会静默丢失
        function report(payload) {
            try {
                var body = JSON.stringify(payload);
                // sendBeacon 在队列满或 payload 超限时返回 false，必须看返回值而非仅看 API 是否存在
                if (navigator.sendBeacon && navigator.sendBeacon('/service/grayLog', new Blob([body], { type: 'application/json' }))) {
                    return true;
                }
                var img = new Image();
                img.src = '/service/grayLog?d=' + encodeURIComponent(body) + '&t=' + Date.now();
                pendingImages.push(img);
            } catch (e) {}
            return false;
        }

        function migrate(uuid, bucket, rate) {
            // 命中后页面即将跳走，老版 main.js 不会再执行，此时写 uuid 不会影响 isFirstVisit 判定；
            // 未命中时绝不写入，否则会把对照组用户误标成老访客
            try { localStorage.setItem(UUID_KEY, JSON.stringify(uuid)); } catch (e) {}
            // 命中侧两个事件都必须在此上报：页面即将跳转，走不到 version-control.js 的 goldlog 打点，
            // 未命中侧的 PC_version_gray_judge 则留给 version-control.js 用 goldlog 正常上报，两边不重复
            var beaconOk = report({
                event: 'PC_version_gray_judge',
                visitor_id: uuid,
                bucket: bucket,
                rate: rate,
                hit: 1,
                user_type: 'new',
                stage: 'head_inline'
            });
            beaconOk = report({
                event: 'PC_auto_migrate_exec',
                source: MIGRATE_SRC,
                visitor_id: uuid,
                bucket: bucket,
                rate: rate,
                hit: 1,
                user_type: 'new',
                pathname: location.pathname,
                page_url: location.href,
                stage: 'head_inline'
            }) && beaconOk;
            // 与 index.html head 内联副本保持一致：400 天为浏览器有效期上限，归因 cookie 继续用 90 天
            // 记录跳转前的真实外部来源，供新版 AES 做 landing referrer 归因；新版读取后会立刻清除
            var originalReferrer = document.referrer || '';
            if (originalReferrer) {
                setCookie('amap_original_referrer', encodeURIComponent(originalReferrer), 1);
            }
            setCookie(MIGRATED_COOKIE, '1', 400);
            setCookie(MIGRATE_SRC_COOKIE, MIGRATE_SRC, 90);
            setCookie(VISITED_COOKIE, '1', 400);
            // 对端主域的 cookie 无法由本域页面直写，只能请对端服务端代种；
            // 跳转会中断该请求，属“立即体验”按钮的既有行为，丢失仅影响下次从对端域访问需重新判定
            try {
                var img = new Image();
                img.src = anotherDomainPrefix() + '/service/switchVersion?enable=1&src=' + MIGRATE_SRC;
                pendingImages.push(img);
            } catch (e) {}
            settle({ hit: true, bucket: bucket, rate: rate });
            // 种完 cookie 后原地 replace，由 nginx 302 到对应 /ssr 路径，复用已验证的跳转链路；
            // 用 replace 而非 reload，避免在历史记录里留下老版条目
            if (beaconOk) {
                location.replace(location.href);
            } else {
                // 埋点退到了 Image：立刻 replace 会把请求打断，导致实验组样本缺失而对照组完整，
                // A/B 结论直接失真。让出一次宏任务给请求发起，代价远小于数据单边丢失
                setTimeout(function () { location.replace(location.href); }, 60);
            }
        }

        try {
            if (!localStorageUsable()) { return; }
            if (localStorage.getItem(UUID_KEY) !== null) { return; }
            if (getCookie(MIGRATED_COOKIE)) { return; }
            if (getCookie(VISITED_COOKIE) === '1') { return; }
            if (!!document.documentMode) { return; }
            if (!browserSupportedByNewPC()) { return; }
            if (!PATH_WHITELIST.test(location.pathname)) { return; }
            if (EXCEPT_QUERY.test(location.search || '')) { return; }
            if (EXCEPT_REFERER.test(document.referrer || '')) { return; }

            var uuid = createUuid();
            var bucket = bucketOf(uuid);
            gray.state = 'pending';
            gray.bucket = bucket;

            var xhr = new XMLHttpRequest();
            xhr.open('GET', configUrl(), true);
            xhr.timeout = 5000;
            xhr.onload = function () {
                var rate;
                try {
                    if (xhr.status !== 200) { settle({ error: 'http_' + xhr.status }); return; }
                    var res = JSON.parse(xhr.responseText);
                    if (res.code !== 1 || !res.data) { settle({ error: 'invalid_response' }); return; }
                    // 只认 defaultNew，字段缺失一律视为 0（不放量）
                    var raw = res.data.defaultNew;
                    rate = (raw === undefined || raw === null || raw === '') ? 0 : Number(raw);
                    if (!(rate >= 0 && rate <= 1)) { settle({ error: 'invalid_rate' }); return; }
                } catch (e) {
                    settle({ error: 'parse_error' });
                    return;
                }
                if (bucket < Math.floor(rate * 10000)) {
                    migrate(uuid, bucket, rate);
                } else {
                    settle({ hit: false, rate: rate });
                }
            };
            xhr.onerror = function () { settle({ error: 'network_error' }); };
            xhr.ontimeout = function () { settle({ error: 'timeout' }); };
            xhr.send();
        } catch (e) {
            settle({ error: 'exception' });
        }
    })();
    </script>

    <script>
        var aes = new AES({
            pid: "amap-pc", // 项目 ID
            user_type: "101", // 当前登录用户所属的账号体系
            uid: "", // 当前登录用户的账号 ID
            username: "" // 当前登录用户的账号名称
            // 更多配置参考文档 https://aliyuque.antfin.com/aes/help/kyt9tl#Ewok5
        });
        console.log('AES init done debug');

        // 挂载插件
        aes.use([
            AESPluginPV,
            AESPluginEvent,
            AESPluginAutolog,
            [AESPluginJSError, {
                ignoreList: [
                    // 过滤无堆栈信息的脚本异常：报错信息是'Script error.'或者'Script error'
                    /^Script error\.?$/,
                ]
            }],
            [AESPluginAPI, {
                parseResponse: function(response, statusCode, reqInfo) {
                    if (typeof response == 'string') { // 渲染模板请求
                        return { success: true };
                    }
                    if (typeof response !== 'object') {
                        return { success: false };
                    }
                    var status = response.status,
                        data = response.data,
                        code = response.status || response.data && response.data.code || response.code;

                    return {
                        code: code,
                        msg: data || '',
                        success: status == '1' || status == '14'
                    }
                },
            }],
            AESPluginResourceError,
            AESPluginPerf,
            AESPluginEventTiming
        ])

        // AEM 卡顿（长任务）采集：监听主线程 >50ms 的 longtask 并上报，对齐新版 amap-pc-ssr 口径
        // 单独挂载并做存在性判断的原因：combo 服务在插件文件缺失时会静默跳过但仍返回 200，
        // 此时若在上面的 use 数组里裸写 AESPluginLongTask 会抛 ReferenceError 中断整个 script，
        // 导致 PV/JSError/API 等既有埋点一起失效。这里退化为「仅跳过卡顿采集」。
        if (window.AESPluginLongTask) {
            aes.use([window.AESPluginLongTask]);
        } else if (window.console && console.warn) {
            console.warn('[AES] AESPluginLongTask 未加载，卡顿数据将不上报');
        }
    </script>
